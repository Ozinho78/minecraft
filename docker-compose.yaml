services:
  mc-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINECRAFT_VERSION: "${MINECRAFT_VERSION:-1.21.11}"
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "8888:25565"    
    environment:
      EULA: "${EULA:-false}"
      MINECRAFT_VERSION: "${MINECRAFT_VERSION:-1.21.11}"
      MINECRAFT_PORT: "${MINECRAFT_PORT:-25565}"
      SERVER_NAME: "${SERVER_NAME:-My Minecraft Server}"
      MEMORY_MIN: "${MEMORY_MIN:-1024M}"
      MEMORY_MAX: "${MEMORY_MAX:-2048M}"
      GAMEMODE: "${GAMEMODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      PVP: "${PVP:-true}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-16}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
    volumes:
      - minecraft-data:/opt/minecraft
      - ./logs:/opt/minecraft/logs
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - minecraft-net
    security_opt:
      - no-new-privileges:true

volumes:
  minecraft-data:
    driver: local
    name: minecraft-world-data

networks:
  minecraft-net:
    driver: bridge
    name: minecraft-network
